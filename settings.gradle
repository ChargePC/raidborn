pluginManagement {
    // same story as build.gradle: the plugins use dynamic versions ('1.+', '0.7.+') so gradle has
    // to hit the network, and without these filters it asks every repo for every plugin. one repo
    // down and the build doesn't even start.
    repositories {
        gradlePluginPortal()

        maven {
            name = "MinecraftForge"
            url = "https://maven.minecraftforge.net/"
            content { includeGroupByRegex 'net\\.minecraftforge.*' }
        }

        maven {
            name = "ParchmentMC"
            url = "https://maven.parchmentmc.org"
            content { includeGroupByRegex 'org\\.parchmentmc.*' }
        }

        maven {
            name = "SpongePowered"
            url = "https://repo.spongepowered.org/repository/maven-public/"
            content { includeGroupByRegex 'org\\.spongepowered.*' }
        }
    }
}

plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "0.8.0"
}
